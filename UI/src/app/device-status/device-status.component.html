<section>
  <div class="cards">
    <button type="button" (click)="load('Tagging Station')"><b>{{ summary?.taggingStations?.total ?? '—' }}</b><span>Total Tagging Stations</span><small>Online {{ summary?.taggingStations?.online ?? '—' }} · Offline {{ summary?.taggingStations?.offline ?? '—' }}</small></button>
    <button type="button" (click)="load('Reader')"><b>{{ summary?.readers?.total ?? '—' }}</b><span>Total Readers</span></button>
    <button type="button" (click)="load('Antenna')"><b>{{ summary?.antennas?.total ?? '—' }}</b><span>Configured Antenna Records</span></button>
    <button type="button" (click)="load('Controller')"><b>{{ summary?.controllers?.total ?? '—' }}</b><span>Total Controllers</span></button>
  </div>

  <div class="legend">
    <span><i class="online"></i>Online</span><span><i class="warning"></i>Warning</span><span><i class="offline"></i>Offline</span><span><i class="unknown"></i>Idle / Unknown</span>
  </div>

  <div class="table-panel">
    <h2>Device Details{{ selectedCategory ? ' — ' + selectedCategory : '' }}</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Device Category</th><th>Device Name</th><th>Device Location</th><th>Status</th><th>IP</th><th>Last Error</th></tr></thead>
        <tbody>
          <tr *ngFor="let d of details"><td>{{ d.category }}</td><td>{{ d.name }}</td><td>{{ d.location }}</td><td><span class="status" [class.online-text]="d.status==='Online'" [class.warning-text]="d.status==='Warning'" [class.offline-text]="d.status==='Offline'">{{ d.status }}</span></td><td>{{ d.ip }}</td><td>{{ d.lastError || '—' }}</td></tr>
          <tr *ngIf="details.length === 0"><td colspan="6" class="empty">No device records returned.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
